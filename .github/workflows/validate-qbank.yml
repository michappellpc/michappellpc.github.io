name: Validate question bank
on:
  push:
    paths: ['qbank/**']
  pull_request:
    paths: ['qbank/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate questions
        run: node qbank/tools/validate.js --summary
